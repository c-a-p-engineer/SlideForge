<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark 引用・発言スライド</title>
    <style>@page { size: 1920px 1080px; margin: 0; }</style>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="../sample-catalog.css" />
  </head>
  <body>
    <main class="slide" data-catalog="tech-news" data-theme="dark" data-slide-type="quote" data-slide-phase="p2">
      <div class="slide__shell">
        <header class="slide__header">
          <div class="brand">SlideForge / Dark</div>
          <div class="slide-id">P2-25</div>
        </header>
        <section class="slide__body">
          <p class="kicker">quote</p>
          <h1 class="title">引用・発言スライド</h1>
          <p class="lead">公式発表や関係者発言を読みやすく配置します。</p>
          <div class="quote surface"><blockquote>「現在、原因の調査を進めており、判明次第、速やかにお知らせします。」</blockquote><cite>公式発表より / 日付を明記</cite></div>
        </section>
        <footer class="slide__footer">
          <span>slides/dark/25-quote.html</span>
          <span>25 / 28</span>
        </footer>
      </div>
    </main>
  </body>
</html>
