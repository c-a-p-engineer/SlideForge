<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark ターミナル / ログ表示</title>
    <style>@page { size: 1920px 1080px; margin: 0; }</style>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="../sample-catalog.css" />
  </head>
  <body>
    <main class="slide" data-catalog="tech-news" data-theme="dark" data-slide-type="terminal_log" data-slide-phase="p1">
      <div class="slide__shell">
        <header class="slide__header">
          <div class="brand">SlideForge / Dark</div>
          <div class="slide-id">P1-13</div>
        </header>
        <section class="slide__body">
          <p class="kicker">terminal_log</p>
          <h1 class="title">ターミナル / ログ表示</h1>
          <p class="lead">調査時に見るべきログの粒度を示します。</p>
          <div class="terminal catalog-code"><div class="code-window"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><pre><span class="log-ok">[INFO]</span> audit log loaded
<span class="log-warn">[WARN]</span> unusual request burst detected
<span class="log-bad">[ERROR]</span> permission mismatch on /admin/export
<span class="log-ok">[INFO]</span> token revoked and session closed</pre></div>
        </section>
        <footer class="slide__footer">
          <span>slides/dark/13-terminal-log.html</span>
          <span>13 / 28</span>
        </footer>
      </div>
    </main>
  </body>
</html>
