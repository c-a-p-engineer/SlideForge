<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark リスクマトリクス</title>
    <style>@page { size: 1920px 1080px; margin: 0; }</style>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="../sample-catalog.css" />
  </head>
  <body>
    <main class="slide" data-catalog="tech-news" data-theme="dark" data-slide-type="risk_matrix" data-slide-phase="p1">
      <div class="slide__shell">
        <header class="slide__header">
          <div class="brand">SlideForge / Dark</div>
          <div class="slide-id">P1-20</div>
        </header>
        <section class="slide__body">
          <p class="kicker">risk_matrix</p>
          <h1 class="title">リスクマトリクス</h1>
          <p class="lead">発生確率と影響度で優先順位を判断します。</p>
          <div class="risk"><div class="matrix"><div class="cell low">1</div><div class="cell mid">2</div><div class="cell high">3</div><div class="cell mid">4</div><div class="cell high">5</div><div class="cell critical">6</div><div class="cell high">7</div><div class="cell critical">8</div><div class="cell critical">9</div></div><div class="catalog-panel surface"><p>縦軸は影響度、横軸は発生確率。右上ほど優先対応です。</p></div></div>
        </section>
        <footer class="slide__footer">
          <span>slides/dark/20-risk-matrix.html</span>
          <span>20 / 28</span>
        </footer>
      </div>
    </main>
  </body>
</html>
