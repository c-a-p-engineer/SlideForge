<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book ファイル構成ツリー</title>
    <style>@page { size: 1920px 1080px; margin: 0; }</style>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="../sample-catalog.css" />
  </head>
  <body>
    <main class="slide" data-catalog="tech-news" data-theme="book" data-slide-type="file_tree" data-slide-phase="p1">
      <div class="slide__shell">
        <header class="slide__header">
          <div class="brand">SlideForge / Book</div>
          <div class="slide-id">P1-17</div>
        </header>
        <section class="slide__body">
          <p class="kicker">file_tree</p>
          <h1 class="title">ファイル構成ツリー</h1>
          <p class="lead">プロジェクト構成と責務を示します。</p>
          <div class="filetree"><pre class="tree surface">my-project/
├─ src/
│  ├─ api/
│  └─ auth/
├─ tests/
├─ docs/
└─ package.json</pre><div class="cards3"><div class="catalog-card"><div class="icon">1</div><h2>src/</h2><p>実装コード</p></div><div class="catalog-card"><div class="icon">2</div><h2>tests/</h2><p>自動テスト</p></div><div class="catalog-card"><div class="icon">3</div><h2>docs/</h2><p>運用メモ</p></div></div></div>
        </section>
        <footer class="slide__footer">
          <span>slides/book/17-file-tree.html</span>
          <span>17 / 28</span>
        </footer>
      </div>
    </main>
  </body>
</html>
