<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book 確認フロー</title>
    <style>@page { size: 1920px 1080px; margin: 0; }</style>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="../sample-catalog.css" />
  </head>
  <body>
    <main class="slide" data-catalog="tech-news" data-theme="book" data-slide-type="flowchart" data-slide-phase="p0">
      <div class="slide__shell">
        <header class="slide__header">
          <div class="brand">SlideForge / Book</div>
          <div class="slide-id">P0-09</div>
        </header>
        <section class="slide__body">
          <p class="kicker">flowchart</p>
          <h1 class="title">確認フロー</h1>
          <p class="lead">入力、判定、対応の分岐を整理します。</p>
          <div class="flowchart-grid"><div class="flow-node start">開始</div><div class="flow-arrow down-a">↓</div><div class="flow-node left">監視継続</div><div class="flow-arrow left-a">←</div><div class="flow-decision"><span>異常?</span></div><div class="flow-arrow right-a">→</div><div class="flow-node right">遮断・調査</div><div class="flow-arrow down-b">↓</div><div class="flow-node end">報告</div></div>
        </section>
        <footer class="slide__footer">
          <span>slides/book/09-flowchart.html</span>
          <span>09 / 28</span>
        </footer>
      </div>
    </main>
  </body>
</html>
