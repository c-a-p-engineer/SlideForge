<!DOCTYPE html>
<html lang="ja">
  <head>

  <body>
    <main class="slide" data-catalog="tech-news" data-theme="light" data-slide-type="code" data-slide-phase="p0">
      <div class="slide__shell">
        <header class="slide__header">
          <div class="brand">SlideForge / Light</div>
          <div class="slide-id">P0-11</div>
        </header>
        <section class="slide__body">
          <p class="kicker">code</p>
          <h1 class="title">設定例</h1>
          <p class="lead">危険な権限を避ける設定例を示します。</p>
          <div class="catalog-code"><div class="code-window"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><pre>// 権限を用途ごとに分ける例
const policy = {
  user: [&quot;read:own_profile&quot;],
  support: [&quot;read:tickets&quot;, &quot;write:reply&quot;],
  admin: [&quot;read:audit_log&quot;]
};

assertLeastPrivilege(policy);</pre></div>
        </section>
        <footer class="slide__footer">
          <span>slides/light/11-code.html</span>
          <span>11 / 28</span>
        </footer>
      </div>
    </main>
