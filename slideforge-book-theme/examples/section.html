<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Theme Section</title>
    <link rel="stylesheet" href="../theme/book.css" />
  </head>
  <body>
    <main class="slide">
      <div class="book-page page-shell">
        <header class="page-meta">
          <span class="page-meta__series">AI Code Review</span>
          <span class="page-meta__folio">Section</span>
        </header>
        <section class="stack">
          <div class="section-heading">
            <div class="section-heading__bar" aria-hidden="true"></div>
            <div class="section-heading__body">
              <p class="section-heading__eyebrow">Section 8-2</p>
              <h1 class="section-heading__title">AIコードレビューで先に見るべきは責務の分割</h1>
              <p class="section-heading__desc">見た目の整合性よりも、1つのファイルに入力検証、外部 API 呼び出し、整形、永続化が混ざっていないかを先に確認する。</p>
            </div>
          </div>
          <div class="cols-2">
            <div class="book-box book-box--point">
              <div class="book-box__label">POINT</div>
              <h2 class="book-box__title">レビュー順序を固定すると見落としが減る</h2>
              <div class="book-box__body">
                <p>1. 責務の分離</p>
                <p>2. 失敗時の扱い</p>
                <p>3. テスト可能性</p>
              </div>
            </div>
            <div class="book-box book-box--memo">
              <div class="book-box__label">MEMO</div>
              <h2 class="book-box__title">後から直しにくい部分から見る</h2>
              <div class="book-box__body">
                <p>命名や改行幅は最後でよい。構造の誤りを先に潰さないと、見た目だけ整って中身が壊れたまま残る。</p>
              </div>
            </div>
          </div>
        </section>
        <footer class="page-meta">
          <span>縦線とラベルで節構造を識別</span>
          <span class="page-meta__folio">08-02</span>
        </footer>
      </div>
    </main>
  </body>
</html>
