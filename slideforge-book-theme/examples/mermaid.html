<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Theme Mermaid Wrapper</title>
    <link rel="stylesheet" href="../theme/book.css" />
    <script defer src="../theme/fit.js"></script>
  </head>
  <body>
    <main class="slide">
      <div class="book-page page-shell" data-auto-fit="shrink">
        <header class="page-meta">
          <span class="page-meta__series">Mermaidから商業図解へ変換する流れ</span>
          <span class="page-meta__folio">Mermaid</span>
        </header>
        <section class="mermaid-panel">
          <h1 class="mermaid-title">Mermaid 出力をそのまま載せず、書籍向けに整形する</h1>
          <div class="mermaid-wrapper">
            <div class="mermaid">
              <svg viewBox="0 0 1240 620" role="img" aria-label="Mermaidの整形例">
                <defs>
                  <marker id="mermaid-arrow" class="marker" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
                    <path d="M 0 0 L 12 6 L 0 12 z"></path>
                  </marker>
                  <marker id="mermaid-arrow-accent" class="marker accent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
                    <path d="M 0 0 L 12 6 L 0 12 z"></path>
                  </marker>
                </defs>

                <g class="node gray">
                  <rect x="60" y="80" width="250" height="90" rx="20" ry="20"></rect>
                  <text class="label" x="185" y="135" text-anchor="middle">Mermaidで粗い構造を出す</text>
                </g>

                <g class="node accent">
                  <rect x="480" y="80" width="290" height="90" rx="20" ry="20"></rect>
                  <text class="label" x="625" y="125" text-anchor="middle">意味の重みを線とラベルへ移す</text>
                  <text class="label" x="625" y="152" text-anchor="middle">強調色は1か所だけ使う</text>
                </g>

                <g class="node gray">
                  <rect x="910" y="80" width="270" height="90" rx="20" ry="20"></rect>
                  <text class="label" x="1045" y="135" text-anchor="middle">ReVIEWに載せる図版へ固定</text>
                </g>

                <g class="node">
                  <polygon points="625,250 760,330 625,410 490,330"></polygon>
                  <text class="label" x="625" y="324" text-anchor="middle">色なしでも</text>
                  <text class="label" x="625" y="352" text-anchor="middle">区別できるか</text>
                </g>

                <g class="node gray">
                  <rect x="120" y="472" width="260" height="90" rx="20" ry="20"></rect>
                  <text class="label" x="250" y="527" text-anchor="middle">表・枠・コード例に展開</text>
                </g>

                <g class="node gray">
                  <rect x="860" y="472" width="300" height="90" rx="20" ry="20"></rect>
                  <text class="label" x="1010" y="514" text-anchor="middle">塗り、線幅、余白を微調整</text>
                  <text class="label" x="1010" y="541" text-anchor="middle">印刷確認へ回す</text>
                </g>

                <g class="edgePath">
                  <path d="M310 125 H480" marker-end="url(#mermaid-arrow)"></path>
                </g>
                <g class="edgePath accent">
                  <path d="M770 125 H910" marker-end="url(#mermaid-arrow-accent)"></path>
                </g>
                <g class="edgePath">
                  <path d="M625 170 V250" marker-end="url(#mermaid-arrow)"></path>
                </g>
                <g class="edgePath">
                  <path d="M560 392 C500 430, 410 450, 310 472" marker-end="url(#mermaid-arrow)"></path>
                </g>
                <g class="edgePath accent">
                  <path d="M690 392 C770 430, 860 450, 930 472" marker-end="url(#mermaid-arrow-accent)"></path>
                </g>

                <text class="edgeLabel" x="785" y="108">最終整形</text>
                <text class="edgeLabel" x="472" y="446">はい</text>
                <text class="edgeLabel" x="780" y="446">追加調整</text>
              </svg>
            </div>
          </div>
          <p class="caption">Mermaid の class 名に寄せた CSS を用意し、生成 SVG を後段で書籍向けに整形しやすくする。</p>
        </section>
        <footer class="page-meta">
          <span>白塗り / 黒線 / 強調のみアクセント</span>
          <span class="page-meta__folio">03-06</span>
        </footer>
      </div>
    </main>
  </body>
</html>
