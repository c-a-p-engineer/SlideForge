<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Theme Flow</title>
    <link rel="stylesheet" href="../theme/book.css" />
  </head>
  <body>
    <main class="slide">
      <div class="book-page page-shell">
        <header class="page-meta">
          <span class="page-meta__series">CodexでPRを作る流れ</span>
          <span class="page-meta__folio">Flow</span>
        </header>
        <section class="flow-panel">
          <h1 class="flow-title">差分確認から PR 作成までの処理フロー</h1>
          <div class="flow-diagram">
            <svg class="flow-svg" viewBox="0 0 1320 720" role="img" aria-label="CodexでPRを作る処理フロー">
              <defs>
                <marker id="flow-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
                  <path d="M 0 0 L 12 6 L 0 12 z" fill="#111111"></path>
                </marker>
              </defs>

              <rect class="flow-node flow-node--shade" x="40" y="40" rx="22" ry="22" width="280" height="96"></rect>
              <text class="flow-text" x="180" y="92">作業ブランチを確認</text>

              <rect class="flow-node" x="40" y="196" rx="22" ry="22" width="280" height="112"></rect>
              <text class="flow-text" x="180" y="250">差分とテスト結果を整理</text>
              <text class="flow-text flow-text--small" x="180" y="282">git diff / pytest</text>

              <polygon class="flow-node flow-node--decision" points="480,212 610,142 740,212 610,282"></polygon>
              <text class="flow-text" x="610" y="205">説明に必要な</text>
              <text class="flow-text" x="610" y="235">根拠は十分か</text>

              <rect class="flow-node flow-node--accent" x="900" y="188" rx="22" ry="22" width="300" height="120"></rect>
              <text class="flow-text" x="1050" y="236">Codex に PR 本文を依頼</text>
              <text class="flow-text flow-text--small" x="1050" y="268">変更点 / 影響範囲 / 未確認事項</text>

              <rect class="flow-node" x="900" y="456" rx="22" ry="22" width="300" height="112"></rect>
              <text class="flow-text" x="1050" y="510">本文を人間が修正して投稿</text>
              <text class="flow-text flow-text--small" x="1050" y="542">責任は人間が持つ</text>

              <rect class="flow-node flow-node--shade" x="480" y="460" rx="22" ry="22" width="260" height="104"></rect>
              <text class="flow-text" x="610" y="514">根拠を補強して再確認</text>

              <path class="connector connector--strong" d="M180 136 L180 196"></path>
              <path class="connector connector--accent" d="M320 252 L480 252"></path>
              <path class="connector connector--accent" d="M740 212 L900 248"></path>
              <text class="connector-label" x="812" y="204">はい</text>
              <path class="connector" d="M610 282 L610 460"></path>
              <text class="connector-label" x="628" y="384">いいえ</text>
              <path class="connector" d="M740 512 L900 512"></path>
              <path class="connector connector--strong" d="M1050 308 L1050 456"></path>
            </svg>
          </div>
          <p class="caption">黒線を基本にし、重要ルートだけアクセント色と太線で補強する。分岐は線幅とラベルでも判別できるようにする。</p>
        </section>
        <footer class="page-meta">
          <span>ノード / 矢印 / 分岐 / 線幅の強弱</span>
          <span class="page-meta__folio">07-04</span>
        </footer>
      </div>
    </main>
  </body>
</html>
