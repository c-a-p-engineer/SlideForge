<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Theme Compare Table</title>
    <link rel="stylesheet" href="../theme/book.css" />
  </head>
  <body>
    <main class="slide">
      <div class="book-page page-shell">
        <header class="page-meta">
          <span class="page-meta__series">AIコードレビュー</span>
          <span class="page-meta__folio">Table</span>
        </header>
        <section class="table-panel">
          <h1 class="table-title">人間レビューとAIレビュー支援の役割を分ける</h1>
          <table class="compare-table">
            <caption>2列 / 3列比較に対応する基本表スタイル</caption>
            <thead>
              <tr>
                <th scope="col">観点</th>
                <th scope="col">人間が主担当</th>
                <th scope="col">AIが補助できる</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">責務分離</th>
                <td class="is-better">設計意図と保守性の判断</td>
                <td>関数分割の候補列挙</td>
              </tr>
              <tr>
                <th scope="row">障害時の挙動</th>
                <td class="is-better">失敗条件と復旧手順の妥当性確認</td>
                <td>例外分岐の洗い出し</td>
              </tr>
              <tr>
                <th scope="row">PR説明</th>
                <td>採用理由の最終説明</td>
                <td class="is-better">変更点の下書き整理</td>
              </tr>
              <tr>
                <th scope="row">テスト観点</th>
                <td class="is-better">業務影響の優先順位づけ</td>
                <td>境界値候補の列挙</td>
              </tr>
            </tbody>
          </table>
        </section>
        <footer class="page-meta">
          <span>網掛けヘッダ / 罫線 / 下線で比較強調</span>
          <span class="page-meta__folio">08-05</span>
        </footer>
      </div>
    </main>
  </body>
</html>
